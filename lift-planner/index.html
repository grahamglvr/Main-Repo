<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Plan lifting and rigging jobs offshore. Works with no signal.">
  <title>Lift Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
  <script>
    // Apply saved theme before first paint.
    try {
      var p = JSON.parse(localStorage.getItem('lp-display') || '{}');
      if (p.theme) document.documentElement.dataset.theme = p.theme;
      if (p.size) document.documentElement.dataset.size = p.size;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a id="back" class="icon-btn" href="#/" aria-label="Back" hidden>‹</a>
      <h1 id="title">Lift Planner</h1>
      <div class="status">
        <span id="net" class="pill"></span>
        <span id="saved" class="saved"></span>
      </div>
    </header>
    <nav id="tabs" class="tabs" hidden></nav>
    <main id="view"></main>
  </div>
  <div id="print"></div>

  <noscript>Lift Planner needs JavaScript switched on.</noscript>
  <script src="js/db.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/model.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/report.js"></script>
  <script src="js/markup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
