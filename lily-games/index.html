<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lily's Magic Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
  /* A single bright world on purpose: every colour is set explicitly, no dark mode. */
  @property --base { syntax: "<color>"; inherits: true; initial-value: #FFF1F8; }
  @property --b1 { syntax: "<color>"; inherits: true; initial-value: #FF9ACB; }
  @property --b2 { syntax: "<color>"; inherits: true; initial-value: #9CC9FF; }
  @property --b3 { syntax: "<color>"; inherits: true; initial-value: #FFD98A; }
  @property --b4 { syntax: "<color>"; inherits: true; initial-value: #C7A8FF; }

  :root {
    --ink: #2A1B3D;
    --ink-2: #5E4D72;
    --lemon: #FFC61A;
    --glass: rgba(255, 255, 255, .68);
    --glass-edge: rgba(255, 255, 255, .9);
    --soft: 0 14px 34px -14px rgba(42, 27, 61, .35);
    --display: "Fredoka", "Nunito", "Chalkboard SE", "Comic Sans MS", system-ui, sans-serif;
    --ui: "Nunito", "Fredoka", system-ui, sans-serif;
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    color-scheme: light;
  }
  body              { --base: #FFF1F8; --b1: #FF9ACB; --b2: #9CC9FF; --b3: #FFD98A; --b4: #C7A8FF; --accent: #FF3D8B; --accent-2: #8A5CFF; }
  body.t-colours    { --base: #FFF0F7; --b1: #FF8CC6; --b2: #D7A6FF; --b3: #FFC2DE; --b4: #9FD8FF; --accent: #FF3D8B; --accent-2: #FF7AC0; }
  body.t-count      { --base: #EEF6FF; --b1: #8CC4FF; --b2: #9FF0D2; --b3: #FFE08A; --b4: #B6C2FF; --accent: #2E7BFF; --accent-2: #4FB3FF; }
  body.t-pirate     { --base: #E8FBF7; --b1: #7FE3D0; --b2: #7CC0FF; --b3: #FFE3A0; --b4: #A8F0E0; --accent: #0FA3A3; --accent-2: #2FD3B5; }
  body.t-jigsaw     { --base: #FFF8E6; --b1: #FFD66B; --b2: #FFB0CF; --b3: #FFE9A8; --b4: #A9E4FF; --accent: #FF8A1F; --accent-2: #FFC61A; }
  body.t-shadows    { --base: #F3EEFF; --b1: #B79BFF; --b2: #FF9FD6; --b3: #8FB0FF; --b4: #D9C8FF; --accent: #7045F0; --accent-2: #A77BFF; }
  body.t-patterns   { --base: #FFF1EE; --b1: #FFA38F; --b2: #FF9CCB; --b3: #FFD58A; --b4: #C9B5FF; --accent: #FF4D6D; --accent-2: #FF8A6B; }
  body.t-builder    { --base: #EEFBF2; --b1: #8FE6B4; --b2: #FFD66B; --b3: #8CC4FF; --b4: #FF9F8F; --accent: #12A865; --accent-2: #3DD68C; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--ui);
    color: var(--ink);
    background: var(--base);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: --base .9s ease, --b1 .9s ease, --b2 .9s ease, --b3 .9s ease, --b4 .9s ease;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible, [role="button"]:focus-visible { outline: 4px solid var(--accent); outline-offset: 4px; }
  .emoji { font-family: var(--emoji); line-height: 1; }
  svg { display: block; }

  /* ---------- Background: drifting colour fields, sparkles and fine grain ---------- */
  .sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; width: 80vmax; height: 80vmax; border-radius: 50%; }
  .blob.one   { top: -38vmax; left: -30vmax;  background: radial-gradient(circle, var(--b1) 0, transparent 62%); animation: drift-a 24s ease-in-out infinite alternate; }
  .blob.two   { top: -34vmax; right: -34vmax; background: radial-gradient(circle, var(--b2) 0, transparent 62%); animation: drift-b 28s ease-in-out infinite alternate; }
  .blob.three { bottom: -44vmax; left: -22vmax; background: radial-gradient(circle, var(--b3) 0, transparent 62%); animation: drift-b 30s ease-in-out infinite alternate-reverse; }
  .blob.four  { bottom: -40vmax; right: -28vmax; background: radial-gradient(circle, var(--b4) 0, transparent 62%); animation: drift-a 26s ease-in-out infinite alternate-reverse; }
  .sky::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 50% at 50% 55%, rgba(255, 255, 255, .55), transparent 70%); }
  .spark { position: absolute; color: #fff; opacity: .9; animation: twinkle 3.2s ease-in-out infinite; filter: drop-shadow(0 2px 6px rgba(42, 27, 61, .12)); }
  .spark svg { width: 100%; height: 100%; }
  .grain {
    position: absolute; inset: 0; opacity: .08; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  #app { position: relative; z-index: 1; height: 100%; max-width: 1080px; margin: 0 auto; padding-inline: 16px; display: flex; flex-direction: column; }

  /* ---------- Glass chrome ---------- */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(16px) saturate(1.5);
    backdrop-filter: blur(16px) saturate(1.5);
    border: 1.5px solid var(--glass-edge);
    box-shadow: var(--soft);
  }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 6px; }
  .icon-btn { width: 60px; height: 60px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--ink); cursor: pointer; transition: transform .12s ease; }
  .icon-btn svg { width: 28px; height: 28px; }
  .icon-btn:active { transform: scale(.92); }
  .stars { display: flex; align-items: center; gap: 8px; height: 60px; padding: 0 22px 0 14px; border-radius: 999px; font-family: var(--display); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; cursor: pointer; }
  .stars svg { width: 36px; height: 36px; }
  .stars.bump { animation: bump .4s; }
  .bar-right { display: flex; align-items: center; gap: 10px; }
  .tier-wrap { position: relative; }
  .tier { display: flex; align-items: center; gap: 9px; height: 60px; padding: 0 18px 0 16px; border-radius: 999px; font-family: var(--display); font-size: 20px; font-weight: 600; cursor: pointer; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 22px; flex: none; }
  .bars i { width: 6px; border-radius: 3px; background: rgba(42, 27, 61, .15); }
  .bars i:nth-child(1) { height: 40%; }
  .bars i:nth-child(2) { height: 70%; }
  .bars i:nth-child(3) { height: 100%; }
  .bars i.on { background: var(--tc); }
  .tier-menu { position: absolute; right: 0; top: calc(100% + 10px); z-index: 90; width: min(300px, calc(100vw - 32px)); padding: 8px; border-radius: 24px; display: flex; flex-direction: column; gap: 4px; background: rgba(255, 255, 255, .94); }
  .tier-opt { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 10px 12px; border: 0; border-radius: 16px; background: none; text-align: left; cursor: pointer; }
  .tier-opt:hover { background: rgba(42, 27, 61, .05); }
  .tier-opt[aria-checked="true"] { background: color-mix(in srgb, var(--tc) 14%, #fff); }
  .tier-opt b { display: block; font-family: var(--display); font-size: 21px; font-weight: 600; }
  .tier-opt small { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); line-height: 1.3; }
  .tier-opt .tick { width: 24px; height: 24px; color: var(--tc); visibility: hidden; }
  .tier-opt[aria-checked="true"] .tick { visibility: visible; }
  @media (max-width: 480px) {
    .bar, .bar-right { gap: 8px; }
    .icon-btn { width: 54px; height: 54px; }
    .stars, .tier { height: 54px; }
    .stars { font-size: 26px; padding: 0 16px 0 10px; }
    .stars svg { width: 30px; height: 30px; }
    .tier { font-size: 17px; padding: 0 14px 0 12px; }
  }

  #screen { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; }
  .stack { margin-block: auto; padding-block: 8px 24px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 3vh, 28px); }

  /* ---------- Home ---------- */
  .brand { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; text-align: center; }
  .wordmark {
    margin: 0;
    font-family: var(--display); font-weight: 700;
    font-size: clamp(68px, 16vw, 124px); line-height: .95; letter-spacing: -1px;
    background: linear-gradient(95deg, #FF3D8B 0%, #FF8A1F 26%, #FFB800 42%, #2DC56E 58%, #2E7BFF 76%, #8A5CFF 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #fff) drop-shadow(0 14px 18px rgba(42, 27, 61, .18));
    padding-inline: 8px;
  }
  .tagline {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 2px;
    padding: 8px 18px; border-radius: 999px;
    background: var(--ink); color: #fff;
    font-weight: 900; font-size: clamp(14px, 3vw, 18px); letter-spacing: 2.5px; text-transform: uppercase;
    transform: rotate(-2deg);
    box-shadow: 0 10px 20px -8px rgba(42, 27, 61, .5);
  }
  .tagline svg { width: 16px; height: 16px; color: var(--lemon); }
  .tiles { width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (min-width: 680px) { .tiles { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
  .tile {
    --c1: #FF6FB5; --c2: #FF3D8B; --d: #C71F66;
    position: relative; overflow: hidden;
    border: 0; border-radius: 30px;
    padding: 14px 16px 16px;
    min-height: clamp(158px, 32vw, 196px);
    background: linear-gradient(150deg, var(--c1), var(--c2));
    box-shadow: 0 6px 0 var(--d), 0 22px 30px -16px var(--d);
    color: #fff;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 8px;
    text-align: left; cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .tile::before, .tile::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .16); pointer-events: none; }
  .tile::before { width: 170px; height: 170px; right: -56px; top: -64px; }
  .tile::after { width: 90px; height: 90px; left: -30px; bottom: -44px; }
  .tile:hover { transform: translateY(-4px); }
  .tile:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--d), 0 10px 20px -14px var(--d); }
  .chip { position: relative; z-index: 1; padding: 5px 11px; border-radius: 999px; background: rgba(255, 255, 255, .26); font-weight: 900; font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; }
  .tile .icon { position: relative; z-index: 1; align-self: center; font-size: clamp(58px, 13vw, 84px); filter: drop-shadow(0 10px 10px rgba(0, 0, 0, .2)); transition: transform .25s cubic-bezier(.3, 1.6, .6, 1); }
  .tile:hover .icon { transform: scale(1.08) rotate(-4deg); }
  .tile .label { position: relative; z-index: 1; font-family: var(--display); font-weight: 600; font-size: clamp(19px, 4vw, 25px); line-height: 1.08; text-shadow: 0 2px 0 rgba(0, 0, 0, .12); }
  .tile.featured { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; padding: 18px 22px; gap: 16px; }
  .tile.featured .copy { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; flex: 1; }
  .tile.featured .label { font-size: clamp(26px, 5.5vw, 36px); }
  .new { padding: 5px 12px; border-radius: 999px; background: var(--lemon); color: var(--ink); font-weight: 900; font-size: 12px; letter-spacing: 1.4px; box-shadow: 0 4px 10px -4px rgba(0, 0, 0, .3); }
  .model-art { position: relative; z-index: 1; flex: none; --cell: clamp(15px, 3.6vw, 22px); width: calc(8 * var(--cell)); height: calc(4 * var(--cell)); transform: rotate(-3deg); }
  .book { width: 100%; max-width: 900px; border-radius: 26px; padding: 14px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .book h2 { margin: 0 8px 0 0; font-family: var(--display); font-size: 20px; font-weight: 600; }
  .book .sticker { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: #fff; font-size: 28px; box-shadow: 0 6px 12px -6px rgba(42, 27, 61, .35); }
  .book .empty { font-weight: 700; color: var(--ink-2); }

  /* ---------- Prompt bubble ---------- */
  .bubble { display: flex; align-items: center; gap: 14px; max-width: 100%; padding: 10px 14px 10px 10px; border-radius: 32px; font-family: var(--display); font-size: clamp(22px, 5vw, 32px); font-weight: 600; line-height: 1.15; text-align: left; cursor: pointer; }
  .avatar { width: clamp(58px, 13vw, 72px); aspect-ratio: 1; flex: none; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(145deg, var(--accent-2), var(--accent)); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .12); font-size: clamp(34px, 8vw, 44px); }
  .avatar span { animation: talk 1.2s ease-in-out 2; }
  .replay { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; background: rgba(42, 27, 61, .07); color: var(--ink-2); }
  .replay svg { width: 22px; height: 22px; }
  .cw { display: inline-block; padding: 0 12px 3px; border-radius: 14px; background: var(--c); color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .3); }

  /* ---------- Shared answer buttons ---------- */
  .card-btn { border: 0; border-radius: 30px; background: #fff; box-shadow: 0 6px 0 rgba(42, 27, 61, .14), 0 20px 30px -18px rgba(42, 27, 61, .5); display: grid; place-items: center; cursor: pointer; transition: transform .12s ease; }
  .card-btn:active { transform: translateY(4px) scale(.98); }
  .panel { width: 100%; max-width: 700px; border-radius: 34px; padding: 18px; }

  /* Unicorn colours */
  .stage { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .stage .uni { font-size: clamp(76px, 18vw, 124px); animation: hop 2s ease-in-out infinite; filter: drop-shadow(0 12px 12px rgba(42, 27, 61, .18)); }
  .tstar-wrap { filter: drop-shadow(0 12px 14px rgba(42, 27, 61, .25)); }
  .tstar { width: clamp(88px, 21vw, 136px); aspect-ratio: 1; background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .75) 0 8%, transparent 26%), var(--c); clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); animation: spin 8s linear infinite; }
  .balloons { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(10px, 3vw, 28px); }
  .balloon-btn { border: 0; background: none; padding: 0; cursor: pointer; transition: transform 1.3s cubic-bezier(.5, 0, .9, .6); }
  .balloon-btn .bob { display: flex; flex-direction: column; align-items: center; animation: bob 2.6s ease-in-out infinite alternate; animation-delay: var(--delay); }
  .balloon { position: relative; width: clamp(72px, 17vw, 114px); aspect-ratio: .82; border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%; background: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, .85) 0 7%, rgba(255, 255, 255, 0) 24%), var(--c); box-shadow: inset -10px -14px 0 rgba(0, 0, 0, .12), 0 18px 24px -14px rgba(42, 27, 61, .45); }
  .balloon::after { content: ""; position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 11px solid var(--c); }
  .string { width: 2.5px; height: clamp(44px, 9vh, 76px); margin-top: 8px; border-radius: 2px; background: rgba(42, 27, 61, .35); }
  .balloon-btn.fly { transform: translateY(-120vh) rotate(8deg); }

  /* Puppy counting */
  .field { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(6px, 2vw, 14px); }
  .thing { position: relative; border: 0; background: none; padding: 4px; font-size: clamp(50px, 12vw, 82px); cursor: pointer; filter: drop-shadow(0 8px 8px rgba(42, 27, 61, .15)); }
  .thing.counted { animation: hop .4s; }
  .thing.counted::after { content: attr(data-n); position: absolute; right: -4px; top: -6px; min-width: 36px; height: 36px; border-radius: 18px; background: var(--accent); color: #fff; border: 3px solid #fff; font-family: var(--display); font-size: 20px; font-weight: 700; line-height: 30px; }
  .numbers { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(12px, 3vw, 24px); }
  .num { width: clamp(94px, 24vw, 140px); aspect-ratio: 1; border: 0; border-radius: 32px; background: linear-gradient(150deg, var(--c1), var(--c2)); box-shadow: 0 6px 0 var(--d), 0 20px 26px -16px var(--d); color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .num:active { transform: translateY(4px); }
  .num .digit { font-family: var(--display); font-size: clamp(56px, 13vw, 84px); font-weight: 700; line-height: .95; text-shadow: 0 4px 0 rgba(0, 0, 0, .15); }
  .num .dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 76%; }
  .num .dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, .9); }

  /* Pirate sorting */
  .pile { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: clamp(8px, 2.5vw, 16px); min-height: 118px; }
  .treasure { position: relative; width: clamp(62px, 15vw, 86px); aspect-ratio: 1; display: grid; place-items: center; border-radius: 18px; touch-action: none; cursor: grab; filter: drop-shadow(0 8px 6px rgba(42, 27, 61, .22)); }
  .shape { width: 88%; height: 88%; background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .9) 0 9%, rgba(255, 255, 255, 0) 30%), var(--c); }
  .coin .shape { border-radius: 50%; box-shadow: inset 0 0 0 5px rgba(255, 255, 255, .45), inset 0 0 0 10px rgba(0, 0, 0, .1); }
  .gem .shape, .mini.gem { clip-path: polygon(50% 0, 100% 38%, 50% 100%, 0 38%); }
  .star .shape, .mini.star { clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .chests { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(12px, 4vw, 36px); }
  .chest { width: clamp(104px, 27vw, 158px); border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; cursor: pointer; filter: drop-shadow(0 16px 14px rgba(42, 27, 61, .2)); }
  .chest.gulp { animation: gulp .45s; }
  .loot { width: 84%; min-height: 26px; display: flex; flex-wrap: wrap-reverse; justify-content: center; align-content: flex-start; gap: 3px; }
  .mini { width: 20px; height: 20px; }
  .mini.coin { border-radius: 50%; }
  .chest .lid, .chest .box { width: 100%; border: 4px solid #5B3418; background: linear-gradient(90deg, transparent 17%, #F7C948 17% 25%, transparent 25% 75%, #F7C948 75% 83%, transparent 83%), linear-gradient(180deg, rgba(255, 255, 255, .25), rgba(0, 0, 0, .08)), var(--c); }
  .chest .lid { height: clamp(28px, 7vw, 42px); border-radius: 50px 50px 6px 6px; border-bottom-width: 2px; }
  .chest .box { position: relative; height: clamp(58px, 15vw, 86px); border-top: 0; border-radius: 0 0 16px 16px; }
  .chest .lock { position: absolute; left: 50%; top: -6px; width: 24px; height: 28px; transform: translateX(-50%); background: #F7C948; border: 3px solid #5B3418; border-radius: 7px; }

  /* Jigsaw */
  .jig { display: flex; flex-direction: column; align-items: center; gap: 22px; width: 100%; }
  .board { position: relative; display: grid; border-radius: 20px; overflow: hidden; background: #fff; box-shadow: 0 0 0 7px #fff, 0 24px 40px -18px rgba(42, 27, 61, .45); }
  .board::before { content: ""; position: absolute; inset: 0; background: var(--img) center / 100% 100% no-repeat; opacity: .28; pointer-events: none; }
  .board.done { animation: glow 1.2s ease-in-out 2; }
  .cell { position: relative; outline: 2px dashed rgba(42, 27, 61, .25); outline-offset: -1px; }
  .tray { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; min-height: var(--cell); max-width: 100%; }
  .piece { width: var(--cell); height: var(--cell); background-image: var(--img); background-size: calc(var(--cols) * 100%) calc(var(--rows) * 100%); border: 3px solid #fff; border-radius: 12px; box-shadow: 0 12px 18px -10px rgba(42, 27, 61, .5); touch-action: none; cursor: grab; }
  .piece.placed { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; cursor: default; animation: snapin .3s; }

  /* Vampire shadows */
  .hero-pic { width: clamp(136px, 34vw, 200px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 50% 38%, #fff 0 58%, #F1E9FF 59%); box-shadow: 0 0 0 10px rgba(255, 255, 255, .5), 0 26px 40px -20px rgba(42, 27, 61, .5); font-size: clamp(80px, 21vw, 124px); cursor: pointer; }
  .hero-pic span { animation: hop 2s ease-in-out infinite; }
  .shadows { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(12px, 3vw, 24px); }
  .shadow-btn { width: clamp(98px, 25vw, 144px); aspect-ratio: 1; font-size: clamp(58px, 15vw, 92px); background: #F6F1FF; }

  // ---------- 4. Magic Jigsaws: pictures are painted on a canvas ----------
  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  function circle(x, cxp, cyp, r, fill) { x.beginPath(); x.arc(cxp, cyp, r, 0, Math.PI * 2); x.fillStyle = fill; x.fill(); }

      art: [['🦄', 0.5, 0.6, 0.46], ['✨', 0.16, 0.12, 0.13], ['⭐', 0.86, 0.12, 0.12], ['💖', 0.13, 0.86, 0.12]] },

      art: [['🧜‍♀️', 0.5, 0.5, 0.42], ['🐠', 0.17, 0.28, 0.13], ['🐚', 0.18, 0.9, 0.11], ['🐙', 0.84, 0.86, 0.14]] },

    const ghosts = model.parts.map((p, i) => {
      const g = h('div', { class: 'ghost', style: `--x:${p[1]};--y:${p[2]};--w:${p[3]};--h:${p[4]}`, html: partSVG(p, { ghost: true }) });
      g.dataset.sig = sig(p); g.dataset.i = i;
      build.append(g);
      return g;
    });
    const open = () => ghosts.filter((g) => !g.dataset.filled);
    const under = (x, y) => open().filter((g) => { const r = g.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; });
    const cellPx = () => parseFloat(wrap.style.getPropertyValue('--cell')) || 40;

    shuffle(model.parts).forEach((p) => {
      const el = partEl(p);
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', `${BRICK[p[5]][1]} piece`);
      el.dataset.sig = sig(p);
      draggable(el, {
        onDrop: (x, y) => {
          const match = nearest(open().filter((g) => g.dataset.sig === el.dataset.sig), x, y, cellPx() * 2);
          if (match) return place(el, match);
          if (under(x, y).length) { unpick(); miss(el, 'build.wrong'); }
          return false;
        },
        onTap: () => { unpick(); selected = el; el.classList.add('picked'); say(['col.' + BRICK[p[5]][1], 'tapwhere']); },
      });
      tray.append(el);
    });
    plate.addEventListener('click', (e) => {
      if (!selected || run.busy) return;
      const over = under(e.clientX, e.clientY);
      const match = over.find((g) => g.dataset.sig === selected.dataset.sig);
      if (match) place(selected, match);
      else if (over.length) { const el = selected; unpick(); miss(el, 'build.wrong'); }
    });

    function place(el, g) {
      unpick();
      const i = Number(g.dataset.i), p = model.parts[i];
      el.style.transform = '';
      el.classList.remove('return', 'lift');
      el.dataset.locked = '1';
      el.innerHTML = partSVG(p, { studs: studsFor(model.parts, i) });
      el.style.setProperty('--x', p[1]);
      el.style.setProperty('--y', p[2]);
      el.style.zIndex = 10 + i;
      g.dataset.filled = '1'; g.classList.add('filled');
      build.append(el);
      sfx('click'); burstAt(el, 8);
      if (--left === 0) finish();
      return true;
    }
    function finish() {
      model.deco.forEach(([e, x, y]) => build.append(h('span', { class: 'deco emoji', style: `--x:${x};--y:${y}` }, e)));
      win(plate, ['done.' + model.id]);
      later(() => build.classList.add('fx-' + model.fx), 700);
    }

    wrap.append(plate, tray);
    run.root.append(wrap);
    const fit = () => {
      const W = Math.min(screenEl.clientWidth, 760) - 24;
      const H = screenEl.clientHeight - bub.offsetHeight - 70;
      // Waiting pieces wrap onto lines; draw them as large as the space allows (full size down to 55%).
      const trayHeight = (cell, ts) => {
        const lines = [];
        let x = 0, lineH = 0;
        for (const p of model.parts) {
          const pw = p[3] * cell * ts + 18;
          if (x + pw > W && x > 0) { lines.push(lineH); x = 0; lineH = 0; }
          x += pw; lineH = Math.max(lineH, p[4] * cell * ts);
        }
        lines.push(lineH);
        return lines.reduce((sum, l) => sum + l + 22, 0);
      };
      let cell = 64, ts = 0.55;
      search: for (; cell > 26; cell -= 2) {
        if ((COLS + 0.8) * cell > W) continue;
        for (const t of [1, 0.85, 0.7, 0.55]) {
          if (rows * cell + cell * 0.4 + trayHeight(cell, t) + 30 <= H) { ts = t; break search; }
        }
      }
      wrap.style.setProperty('--cell', `${cell}px`);
      wrap.style.setProperty('--ts', ts);
      wrap.style.setProperty('--stud', `${cell * 0.24}px`);
      wrap.style.setProperty('--base-h', `${cell * 0.4}px`);
    };
    fit();
    addEventListener('resize', fit);
    run.cleanups.push(() => removeEventListener('resize', fit));
  }

  // ---------- home ----------
  const GAMES = [
    { id: 'builder', name: 'Brick Builder', chip: 'Building', c1: '#3DE0A0', c2: '#12A865', d: '#0B7A48', theme: 't-builder', goal: 1, celebrateAfter: 3400, round: buildRound, stickers: ['🚀', '🏠', '🚗', '🌷', '⛵', '🏰', '🍦', '🚒'], featured: true },
    { id: 'colours', name: 'Unicorn Colours', chip: 'Colours', icon: '🦄', c1: '#FF8FC6', c2: '#FF3D8B', d: '#C71F66', theme: 't-colours', goal: 5, round: colourRound, stickers: ['🦄', '🌈', '🎈', '💖', '🍭'] },
    { id: 'count', name: 'Puppy Counting', chip: 'Numbers', icon: '🐶', c1: '#5EC1FF', c2: '#2E7BFF', d: '#1B55C9', theme: 't-count', goal: 5, round: countRound, stickers: ['🐶', '🦴', '🚒', '🐾', '🚓'] },
    { id: 'pirate', name: 'Pirate Treasure', chip: 'Sorting', icon: '🏴‍☠️', c1: '#3FE0C4', c2: '#0FA3A3', d: '#087474', theme: 't-pirate', goal: 1, round: sortRound, stickers: ['🦜', '💰', '⚓', '🐙', '🏝️'] },
    { id: 'jigsaw', name: 'Magic Jigsaws', chip: 'Jigsaws', icon: '🧩', c1: '#FFD84D', c2: '#FF9A1F', d: '#D46D00', theme: 't-jigsaw', goal: 1, round: jigsawRound, stickers: ['🧩', '🏰', '🧜‍♀️', '⭐', '🌈'] },
    { id: 'shadows', name: 'Vampire Shadows', chip: 'Shapes', icon: '🧛', c1: '#B08BFF', c2: '#7045F0', d: '#4E26C4', theme: 't-shadows', goal: 5, round: shadowRound, stickers: ['🧛', '🦇', '🌙', '👻', '🎃'] },
    { id: 'patterns', name: 'Dress-up Patterns', chip: 'Patterns', icon: '👑', c1: '#FF9A7A', c2: '#FF4D6D', d: '#D12A4A', theme: 't-patterns', goal: 5, round: patternRound, stickers: ['👑', '👗', '👠', '🎀', '💍'] },
  ];

  function showHome() {
    endRun(); hush();
    cheer.hidden = true;
    document.body.className = '';
    homeBtn.style.visibility = 'hidden';
    const stack = h('div', { class: 'stack' });
    const brand = h('div', { class: 'brand' },
      h('h1', { class: 'wordmark' }, 'Lily\'s'),
      h('span', { class: 'tagline', html: `${ICONS.sparkle}<span>Magic Games</span>${ICONS.sparkle}` }));
    brand.addEventListener('click', () => { sfx('yay'); say('hello'); burstAt(brand, 30); });
    const tiles = h('div', { class: 'tiles' });
    GAMES.forEach((g) => {
      const t = h('button', { class: 'tile' + (g.featured ? ' featured' : ''), type: 'button', style: `--c1:${g.c1};--c2:${g.c2};--d:${g.d}` });
      if (g.featured) {
        const art = modelArt(MODELS.find((m) => m.id === 'car'));
        t.append(h('div', { class: 'copy' }, h('span', { class: 'new' }, 'NEW'), h('span', { class: 'label' }, g.name), h('span', { class: 'chip' }, g.chip)), art);
      } else {
        t.append(h('span', { class: 'chip' }, g.chip), h('span', { class: 'icon emoji' }, g.icon), h('span', { class: 'label' }, g.name));
      }
      t.addEventListener('click', () => { sfx('pop'); startGame(g); });
      tiles.append(t);
    });
    const book = h('section', { class: 'book glass' }, h('h2', {}, 'Lily\'s stickers'));
    const got = store.get('stickers', []);
    if (got.length) got.forEach((s) => book.append(h('span', { class: 'sticker emoji' }, s)));
    else book.append(h('span', { class: 'empty' }, 'Finish a game to win a sticker!'));
    stack.append(brand, tiles, book);
    screenEl.replaceChildren(stack);
    screenEl.scrollTop = 0;
  }

  document.addEventListener('contextmenu', (e) => e.preventDefault());
  showHome();
})();
</script>
</body>
</html>
