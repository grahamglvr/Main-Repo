<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lily's Magic Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
  /* One bright candy world, deliberately single-theme: every colour is set explicitly. */
  :root {
    --ink: #3B1F4A;
    --ink-soft: #6E5680;
    --pink: #FF4FA3;
    --sun: #FFC93C;
    --mint: #2ED3A7;
    --sky: #38B6FF;
    --grape: #8B5CF6;
    --coral: #FF7A59;
    --card: #FFFFFF;
    --wood: #6B3E1F;
    --gold: #F5C542;
    --bg1: #FFE3F3;
    --bg2: #DDF0FF;
    --lift: 0 6px 0 rgba(59, 31, 74, .18);
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    color-scheme: light;
  }
  body.t-colours  { --bg1: #FFE1F3; --bg2: #F1E2FF; }
  body.t-count    { --bg1: #DCF1FF; --bg2: #E6FFF6; }
  body.t-pirate   { --bg1: #D2FAEF; --bg2: #BDE6FF; }
  body.t-jigsaw   { --bg1: #FFF3C9; --bg2: #FFE2EF; }
  body.t-shadows  { --bg1: #EADFFF; --bg2: #CDB9FF; }
  body.t-patterns { --bg1: #FFE5DB; --bg2: #FFE0F1; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Fredoka", "Chalkboard SE", "Comic Sans MS", system-ui, sans-serif;
    color: var(--ink);
    background-color: var(--bg1);
    background-image:
      radial-gradient(circle at 20px 20px, rgba(255, 255, 255, .75) 3px, transparent 4px),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    background-size: 40px 40px, 100% 100%;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible, .piece:focus-visible { outline: 5px solid var(--grape); outline-offset: 3px; }
  .emoji { font-family: var(--emoji); line-height: 1; }

  #app {
    height: 100%;
    max-width: 1040px;
    margin: 0 auto;
    padding-inline: 16px;
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-block: 10px 6px;
  }
  .round-btn {
    width: 64px; height: 64px;
    flex: none;
    border: 0;
    border-radius: 50%;
    background: var(--card);
    box-shadow: var(--lift);
    font-size: 32px;
    cursor: pointer;
    display: grid; place-items: center;
    transition: transform .1s, box-shadow .1s;
  }
  .round-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(59, 31, 74, .18); }
  .stars {
    display: flex; align-items: center; gap: 8px;
    border: 0;
    background: var(--card);
    border-radius: 999px;
    padding: 8px 22px 8px 16px;
    box-shadow: var(--lift);
    font-size: 30px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }
  .stars.bump { animation: bump .35s; }

  #screen {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }
  .stack {
    margin-block: auto;
    padding-block: 8px 20px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(14px, 3vh, 26px);
  }

  /* Home */
  .title {
    margin: 0;
    text-align: center;
    line-height: 1;
    font-weight: 700;
    cursor: pointer;
  }
  .title .name {
    display: block;
    font-size: clamp(56px, 13vw, 104px);
    letter-spacing: 2px;
  }
  .title .name span {
    display: inline-block;
    text-shadow: 0 5px 0 rgba(59, 31, 74, .16);
    animation: hop 2.4s ease-in-out infinite;
  }
  .title .sub {
    display: block;
    margin-top: 6px;
    font-size: clamp(26px, 5.5vw, 42px);
    color: var(--ink);
  }
  .tiles {
    width: 100%;
    max-width: 860px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  @media (min-width: 640px) { .tiles { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
  .tile {
    --c: var(--pink); --d: #D23F87;
    border: 0;
    border-radius: 30px;
    background:
      radial-gradient(circle at 80% 15%, rgba(255, 255, 255, .35) 0 18%, transparent 19%),
      var(--c);
    box-shadow: 0 8px 0 var(--d);
    padding: 14px 10px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    cursor: pointer;
    transition: transform .12s;
  }
  .tile:hover { transform: translateY(-3px) rotate(-1deg); }
  .tile:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--d); }
  .tile .icon { font-size: clamp(58px, 14vw, 96px); filter: drop-shadow(0 4px 0 rgba(0, 0, 0, .15)); }
  .tile .label {
    background: var(--card);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: clamp(17px, 3.6vw, 23px);
    font-weight: 600;
    text-align: center;
    line-height: 1.15;
  }
  .book {
    width: 100%;
    max-width: 860px;
    background: rgba(255, 255, 255, .7);
    border-radius: 26px;
    padding: 12px 18px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  }
  .book .book-label { font-size: 20px; font-weight: 600; margin-right: 6px; }
  .book .sticker { font-size: 34px; animation: none; }
  .book .empty { font-size: 18px; color: var(--ink-soft); }

  /* Speech bubble prompt */
  .bubble {
    display: flex; align-items: center; gap: 12px;
    max-width: 100%;
    border: 0;
    background: var(--card);
    border-radius: 30px;
    padding: 10px 22px 10px 12px;
    box-shadow: var(--lift);
    font-size: clamp(22px, 5vw, 34px);
    font-weight: 600;
    text-align: left;
    line-height: 1.2;
    cursor: pointer;
  }
  .bubble .who { font-size: clamp(44px, 10vw, 60px); flex: none; animation: talk 1.2s ease-in-out 2; }
  .bubble .again { font-size: 24px; opacity: .55; flex: none; }
  .cw {
    display: inline-block;
    padding: 0 12px 2px;
    border-radius: 14px;
    background: var(--c);
    color: #fff;
    text-shadow: 0 2px 0 rgba(0, 0, 0, .35);
  }

  /* Unicorn colours */
  .stage { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .stage .uni { font-size: clamp(76px, 18vw, 124px); animation: hop 2s ease-in-out infinite; }
  .tstar-wrap { filter: drop-shadow(0 6px 0 rgba(59, 31, 74, .2)); }
  .tstar {
    width: clamp(84px, 21vw, 136px);
    aspect-ratio: 1;
    background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .7) 0 8%, transparent 26%), var(--c);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    animation: spin 6s linear infinite;
  }
  .balloons { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(10px, 3vw, 26px); }
  .balloon-btn {
    border: 0; background: none; padding: 0;
    cursor: pointer;
    transition: transform 1.3s cubic-bezier(.5, 0, .9, .6), opacity 1.3s;
  }
  .balloon-btn .bob { display: flex; flex-direction: column; align-items: center; animation: bob 2.6s ease-in-out infinite alternate; animation-delay: var(--delay); }
  .balloon {
    position: relative;
    width: clamp(70px, 17vw, 112px);
    aspect-ratio: .82;
    border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%;
    background: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, .8) 0 7%, rgba(255, 255, 255, 0) 22%), var(--c);
    box-shadow: inset -9px -12px 0 rgba(0, 0, 0, .12);
  }
  .balloon::after {
    content: "";
    position: absolute; left: 50%; bottom: -9px;
    transform: translateX(-50%);
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 11px solid var(--c);
  }
  .string { width: 3px; height: clamp(44px, 9vh, 76px); margin-top: 8px; border-radius: 2px; background: #9C88AE; }
  .balloon-btn.fly { transform: translateY(-120vh) rotate(8deg); }

  /* Puppy counting */
  .field {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: clamp(6px, 2vw, 14px);
    max-width: 680px;
    background: rgba(255, 255, 255, .6);
    border-radius: 30px;
    padding: 16px;
  }
  .thing {
    position: relative;
    border: 0; background: none; padding: 4px;
    font-size: clamp(50px, 12vw, 84px);
    cursor: pointer;
  }
  .thing.counted { animation: hop .4s; }
  .thing.counted::after {
    content: attr(data-n);
    position: absolute; right: -2px; top: -4px;
    min-width: 34px; height: 34px;
    border-radius: 17px;
    background: var(--pink);
    color: #fff;
    font-family: "Fredoka", system-ui, sans-serif;
    font-size: 22px; font-weight: 700;
    line-height: 34px;
    box-shadow: 0 3px 0 #C8327C;
  }
  .numbers { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(12px, 3vw, 24px); }
  .num {
    width: clamp(92px, 24vw, 140px);
    aspect-ratio: 1;
    border: 0;
    border-radius: 30px;
    background: var(--c);
    box-shadow: 0 7px 0 rgba(59, 31, 74, .25);
    color: #fff;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .num:active { transform: translateY(4px); }
  .num .digit { font-size: clamp(54px, 13vw, 82px); font-weight: 700; line-height: 1; text-shadow: 0 4px 0 rgba(0, 0, 0, .2); font-variant-numeric: tabular-nums; }
  .num .dots { font-size: 13px; letter-spacing: 2px; max-width: 80%; line-height: 1.1; word-break: break-all; }

  /* Pirate sorting */
  .pile {
    width: 100%; max-width: 680px;
    min-height: 110px;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: clamp(8px, 2.5vw, 16px);
    padding: 16px;
    border-radius: 34px;
    background:
      radial-gradient(circle at 15% 30%, rgba(255, 255, 255, .5) 0 3px, transparent 4px),
      radial-gradient(circle at 70% 70%, rgba(255, 255, 255, .5) 0 3px, transparent 4px),
      #FFE3A3;
    background-size: 46px 46px, 58px 58px, auto;
    box-shadow: inset 0 -6px 0 rgba(160, 110, 40, .2);
  }
  .treasure {
    position: relative;
    width: clamp(60px, 15vw, 86px);
    aspect-ratio: 1;
    display: grid; place-items: center;
    border-radius: 18px;
    touch-action: none;
    cursor: grab;
    filter: drop-shadow(0 5px 0 rgba(59, 31, 74, .22));
  }
  .shape {
    width: 88%; height: 88%;
    background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .85) 0 9%, rgba(255, 255, 255, 0) 30%), var(--c);
  }
  .coin .shape { border-radius: 50%; box-shadow: inset 0 0 0 5px rgba(255, 255, 255, .45), inset 0 0 0 10px rgba(0, 0, 0, .1); }
  .gem .shape, .mini.gem { clip-path: polygon(50% 0, 100% 38%, 50% 100%, 0 38%); }
  .star .shape, .mini.star { clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .chests { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(12px, 4vw, 34px); }
  .chest {
    width: clamp(100px, 27vw, 156px);
    border: 0; background: none; padding: 0;
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer;
  }
  .chest.gulp { animation: gulp .45s; }
  .loot {
    width: 84%; min-height: 26px;
    display: flex; flex-wrap: wrap-reverse; justify-content: center; align-content: flex-start; gap: 3px;
  }
  .mini { width: 20px; height: 20px; }
  .mini.coin { border-radius: 50%; }
  .chest .lid, .chest .box {
    width: 100%;
    border: 4px solid var(--wood);
    background:
      linear-gradient(90deg, transparent 17%, var(--gold) 17% 25%, transparent 25% 75%, var(--gold) 75% 83%, transparent 83%),
      var(--c);
  }
  .chest .lid { height: clamp(28px, 7vw, 42px); border-radius: 50px 50px 6px 6px; border-bottom-width: 2px; }
  .chest .box { position: relative; height: clamp(58px, 15vw, 86px); border-top: 0; border-radius: 0 0 16px 16px; box-shadow: 0 7px 0 rgba(59, 31, 74, .22); }
  .chest .lock {
    position: absolute; left: 50%; top: -6px;
    width: 24px; height: 28px;
    transform: translateX(-50%);
    background: var(--gold);
    border: 3px solid var(--wood);
    border-radius: 7px;
  }

  /* Jigsaw */
  .jig { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
  .board {
    position: relative;
    display: grid;
    border-radius: 18px;
    overflow: hidden;
    background: var(--card);
    box-shadow: 0 0 0 6px var(--card), 0 12px 0 6px rgba(59, 31, 74, .15);
  }
  .board::before {
    content: "";
    position: absolute; inset: 0;
    background: var(--img) center / 100% 100% no-repeat;
    opacity: .28;
    pointer-events: none;
  }
  .board.done { animation: glow 1.2s ease-in-out 2; }
  .cell { position: relative; outline: 2px dashed rgba(59, 31, 74, .28); outline-offset: -1px; }
  .tray { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; min-height: var(--cell); max-width: 100%; }
  .piece {
    width: var(--cell); height: var(--cell);
    background-image: var(--img);
    background-size: calc(var(--cols) * 100%) calc(var(--rows) * 100%);
    border: 3px solid var(--card);
    border-radius: 12px;
    box-shadow: 0 5px 0 rgba(59, 31, 74, .22);
    touch-action: none;
    cursor: grab;
  }
  .piece.placed {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0; border-radius: 0; box-shadow: none;
    cursor: default;
    animation: snapin .3s;
  }

  /* Vampire shadows */
  .hero {
    width: clamp(130px, 34vw, 200px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #FFFFFF 0 55%, #F6EEFF 56%);
    box-shadow: 0 0 0 8px rgba(255, 255, 255, .5), var(--lift);
    display: grid; place-items: center;
    font-size: clamp(80px, 21vw, 124px);
  }
  .hero span { animation: hop 2s ease-in-out infinite; }
  .shadows { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(12px, 3vw, 24px); }
  .shadow-btn {
    width: clamp(96px, 25vw, 144px);
    aspect-ratio: 1;
    border: 0;
    border-radius: 30px;
    background: #F4EDFF;
    box-shadow: 0 7px 0 #A58BE0;
    display: grid; place-items: center;
    font-size: clamp(58px, 15vw, 92px);
    cursor: pointer;
  }
  .shadow-btn span { filter: brightness(0); opacity: .82; transition: filter .6s, opacity .6s; }
  .shadow-btn.reveal { background: #FFF6B8; box-shadow: 0 7px 0 #E4B52B; }
  .shadow-btn.reveal span { filter: none; opacity: 1; }

  /* Dress-up patterns */
  .pattern {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: clamp(6px, 1.6vw, 12px);
    max-width: 900px;
  }
  .slot {
    width: clamp(58px, 13vw, 96px);
    aspect-ratio: 1;
    border: 0;
    border-radius: 22px;
    background: var(--card);
    box-shadow: var(--lift);
    display: grid; place-items: center;
    font-size: clamp(38px, 9vw, 64px);
    cursor: pointer;
  }
  .slot.ask {
    background: #FFF0F8;
    outline: 4px dashed var(--pink);
    outline-offset: -8px;
    color: var(--pink);
    font-family: "Fredoka", system-ui, sans-serif;
    font-weight: 700;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .slot.filled { animation: snapin .35s; outline: 0; background: #FFF6B8; }
  .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(14px, 4vw, 28px); }
  .choice {
    width: clamp(96px, 25vw, 136px);
    aspect-ratio: 1;
    border: 0;
    border-radius: 30px;
    background: var(--c);
    box-shadow: 0 7px 0 rgba(59, 31, 74, .25);
    display: grid; place-items: center;
    font-size: clamp(58px, 14vw, 84px);
    cursor: pointer;
  }

  /* Shared bits */
  .picked { outline: 5px dashed var(--pink); outline-offset: 3px; }
  .lift { position: relative; z-index: 50; cursor: grabbing; filter: drop-shadow(0 12px 6px rgba(59, 31, 74, .3)); }
  .return { transition: transform .3s cubic-bezier(.3, 1.4, .6, 1); }
  .wiggle { animation: wiggle .5s; }

  .cheer {
    position: fixed; inset: 0;
    z-index: 100;
    display: grid; place-items: center;
    padding: 16px;
    background: rgba(59, 31, 74, .45);
  }
  .cheer-card {
    width: min(420px, 100%);
    background: var(--card);
    border-radius: 40px;
    padding: 24px 24px 28px;
    text-align: center;
    box-shadow: 0 12px 0 rgba(59, 31, 74, .25);
    animation: pop .5s cubic-bezier(.3, 1.5, .6, 1);
  }
  .cheer-sticker { font-size: 120px; display: inline-block; animation: hop 1s ease-in-out infinite; }
  .cheer-title { margin-top: 6px; font-size: 48px; font-weight: 700; color: var(--pink); line-height: 1; }
  .cheer-stars { margin-top: 8px; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cheer-btns { margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 22px; }
  .play-btn {
    width: 104px; height: 104px;
    border: 0; border-radius: 50%;
    background: var(--pink);
    box-shadow: 0 8px 0 #C8327C;
    color: #fff;
    font-size: 50px;
    padding-left: 8px;
    cursor: pointer;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .flystar {
    position: fixed;
    z-index: 150;
    margin: -30px 0 0 -30px;
    font-size: 60px;
    pointer-events: none;
    transition: transform .8s cubic-bezier(.5, -.3, .6, 1);
  }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 200; pointer-events: none; }

  @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes bob { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-14px) rotate(2deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes talk { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
  @keyframes bump { 50% { transform: scale(1.25); } }
  @keyframes wiggle { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px) rotate(-5deg); } 40% { transform: translateX(10px) rotate(5deg); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  @keyframes gulp { 40% { transform: scale(1.12, .9); } 70% { transform: scale(.95, 1.06); } }
  @keyframes snapin { from { transform: scale(1.15); } to { transform: scale(1); } }
  @keyframes pulse { 50% { transform: scale(1.07); } }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes glow { 50% { box-shadow: 0 0 0 6px var(--card), 0 0 0 16px var(--sun); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    .balloon-btn { transition-duration: .4s; }
  }
</style>
</head>
<body class="t-home">
<div id="app">
  <header class="bar">
    <button id="homeBtn" class="round-btn emoji" type="button" aria-label="Back to all games">🏠</button>
    <button id="stars" class="stars" type="button" aria-label="Stars collected"><span class="emoji">⭐</span><span id="starCount">0</span></button>
    <button id="soundBtn" class="round-btn emoji" type="button" aria-label="Turn sound off">🔊</button>
  </header>
  <main id="screen"></main>
</div>

<div id="cheer" class="cheer" hidden>
  <div class="cheer-card">
    <div id="cheerSticker" class="cheer-sticker emoji">🦄</div>
    <div class="cheer-title">Yay, Lily!</div>
    <div id="cheerStars" class="cheer-stars">You have 0 stars</div>
    <div class="cheer-btns">
      <button id="cheerHome" class="round-btn emoji" type="button" aria-label="Back to all games">🏠</button>
      <button id="cheerMore" class="play-btn" type="button" aria-label="Play again">▶</button>
    </div>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
(() => {
  'use strict';

  // ---------- little helpers ----------
  const $ = (s) => document.querySelector(s);
  const rand = (n) => Math.floor(Math.random() * n);
  const pick = (a) => a[rand(a.length)];
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pickNot = (a, last) => { const pool = a.filter((x) => x !== last); return pick(pool.length ? pool : a); };
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  function hills(x, w, h, c1, c2) {
    x.fillStyle = c1; x.beginPath(); x.ellipse(w * 0.2, h * 1.05, w * 0.6, h * 0.36, 0, 0, Math.PI * 2); x.fill();
    x.fillStyle = c2; x.beginPath(); x.ellipse(w * 0.85, h * 1.08, w * 0.6, h * 0.32, 0, 0, Math.PI * 2); x.fill();
  }
  function sea(x, w, h, top) {
    ['#4FC3F7', '#29A0E0', '#1C7FC4'].forEach((c, k) => {
      const y0 = h * (top + k * 0.1);
      x.fillStyle = c; x.beginPath(); x.moveTo(0, h);
      for (let px = 0; px <= w; px += 10) x.lineTo(px, y0 + Math.sin(px / 40 + k) * h * 0.02);
      x.lineTo(w, h); x.closePath(); x.fill();
    });
  }
  function sparkles(x, w, h, col, n) {
    for (let i = 0; i < n; i++) circle(x, ((i * 97) % 100) / 100 * w, ((i * 53) % 60) / 100 * h, 2 + (i % 3), col);
  }
  function bubbles(x, w, h) {
    x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = 3;
    for (let i = 0; i < 14; i++) { x.beginPath(); x.arc(((i * 71) % 100) / 100 * w, ((i * 37) % 90) / 100 * h, 6 + (i % 4) * 5, 0, Math.PI * 2); x.stroke(); }
  }
  const SCENES = [
    { name: 'unicorn', who: '🦄', sky: ['#FFC8EC', '#E4D4FF'], paint: (x, w, h) => { rainbow(x, w, h); clouds(x, w, h, [[0.16, 0.22], [0.84, 0.3]]); },
      art: [['🦄', 0.5, 0.6, 0.46], ['✨', 0.16, 0.12, 0.13], ['⭐', 0.86, 0.12, 0.12], ['💖', 0.13, 0.86, 0.12]] },
    { name: 'pirate ship', who: '🦜', sky: ['#7FD3FF', '#DDF4FF'], paint: (x, w, h) => { sun(x, w * 0.84, h * 0.17, Math.min(w, h) * 0.08); clouds(x, w, h, [[0.2, 0.18]]); sea(x, w, h, 0.66); },
      art: [['⛵', 0.5, 0.52, 0.44], ['🦜', 0.16, 0.36, 0.14], ['🐙', 0.84, 0.86, 0.13], ['💰', 0.15, 0.87, 0.12]] },
    { name: 'puppy', who: '🐶', sky: ['#A6E6FF', '#EFFCFF'], paint: (x, w, h) => { sun(x, w * 0.15, h * 0.16, Math.min(w, h) * 0.08); clouds(x, w, h, [[0.78, 0.18]]); hills(x, w, h, '#7ED957', '#5CC43A'); },
      art: [['🐶', 0.5, 0.56, 0.42], ['🦴', 0.16, 0.86, 0.13], ['🚒', 0.82, 0.84, 0.17]] },
    { name: 'vampire castle', who: '🧛', sky: ['#3D1F6B', '#B26BE8'], paint: (x, w, h) => { sparkles(x, w, h, '#FFF6C9', 18); circle(x, w * 0.8, h * 0.2, Math.min(w, h) * 0.11, '#FFF1A8'); hills(x, w, h, '#6A34A0', '#4E2379'); },
      art: [['🏰', 0.44, 0.58, 0.42], ['🦇', 0.16, 0.18, 0.12], ['🦇', 0.58, 0.13, 0.09], ['🧛', 0.84, 0.8, 0.2]] },
    { name: 'princess', who: '👸', sky: ['#FFB8DD', '#FFF0F8'], paint: (x, w, h) => { clouds(x, w, h, [[0.18, 0.16], [0.82, 0.12]]); hills(x, w, h, '#FF9ACD', '#F272B6'); },
      art: [['🏰', 0.68, 0.5, 0.38], ['👸', 0.28, 0.62, 0.34], ['👑', 0.28, 0.2, 0.14], ['🎀', 0.88, 0.86, 0.1]] },
    { name: 'mermaid', who: '🧜‍♀️', sky: ['#62E0E6', '#1F7FD1'], paint: (x, w, h) => { bubbles(x, w, h); x.fillStyle = '#FFE08A'; x.beginPath(); x.ellipse(w / 2, h * 1.1, w * 0.8, h * 0.22, 0, 0, Math.PI * 2); x.fill(); },
      art: [['🧜‍♀️', 0.5, 0.5, 0.42], ['🐠', 0.17, 0.28, 0.13], ['🐚', 0.18, 0.9, 0.11], ['🐙', 0.84, 0.86, 0.14]] },
  ];
  function paintScene(scene, w, h) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, h);
    scene.sky.forEach((col, i) => g.addColorStop(i / (scene.sky.length - 1), col));
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    scene.paint(x, w, h);
    const m = Math.min(w, h);
    x.textAlign = 'center'; x.textBaseline = 'middle';
    for (const [e, fx, fy, fs] of scene.art) { x.font = `${Math.round(fs * m)}px ${EMOJI_FONT}`; x.fillText(e, fx * w, fy * h); }
    return c.toDataURL('image/png');
  }
  function jigsawRound(run) {
    const [cols, rows] = [[2, 2], [3, 2], [3, 3]][run.level];
    const scene = pickNot(SCENES, run.last); run.last = scene;
    const img = paintScene(scene, 600, Math.round(600 * rows / cols));
    const bub = bubble(scene.who, `Build the ${scene.name} picture!`, `Let's build the ${scene.name} picture! Drag the pieces onto the picture.`);
    const n = cols * rows;
    const wrap = h('div', { class: 'jig' });
    wrap.style.setProperty('--img', `url(${img})`);
    wrap.style.setProperty('--cols', cols);
    wrap.style.setProperty('--rows', rows);
    const board = h('div', { class: 'board' });
    board.style.gridTemplateColumns = `repeat(${cols}, var(--cell))`;
    board.style.gridTemplateRows = `repeat(${rows}, var(--cell))`;
    const tray = h('div', { class: 'tray' });
    let selected = null, placed = 0;
    const unpick = () => { if (selected) selected.classList.remove('picked'); selected = null; };

    const cells = [];
    const pieces = [];
    for (let i = 0; i < n; i++) {
      const r = Math.floor(i / cols), c = i % cols;
      const cell = h('div', { class: 'cell' });
      cell.dataset.i = i;
      cell.addEventListener('click', () => { if (selected && !run.busy) tryPlace(selected, cell); });
      board.append(cell); cells.push(cell);

      const p = h('div', { class: 'piece', role: 'button', 'aria-label': `Puzzle piece ${i + 1}` });
      p.dataset.i = i;
      p.style.backgroundPosition = `${cols > 1 ? (c / (cols - 1)) * 100 : 0}% ${rows > 1 ? (r / (rows - 1)) * 100 : 0}%`;
      draggable(p, {
        onDrop: (x, y) => {
          // Very forgiving: anywhere near the right spot counts.
          const home = centre(cells[i]);
          if (!cells[i].firstChild && Math.hypot(x - home.x, y - home.y) < home.r.width * 0.65) return tryPlace(p, cells[i]);
          const z = zoneAt(cells.filter((cl) => !cl.firstChild), x, y, 0);
          return z ? tryPlace(p, z) : false;
        },
        onTap: () => { unpick(); selected = p; p.classList.add('picked'); say('Now tap where it goes!'); },
      });
      pieces.push(p);
    }
    tray.append(...shuffle(pieces));

    function tryPlace(p, cell) {
      if (cell.dataset.i !== p.dataset.i || cell.firstChild) { unpick(); miss(p, 'Not there. Try another spot!'); return false; }
      unpick();
      p.style.transform = '';
      p.classList.remove('return');
      p.classList.add('placed');
      p.dataset.locked = '1';
      cell.append(p);
      sfx('snap'); burstAt(cell, 10);
      placed++;
      if (placed === n) { board.classList.add('done'); win(board, `You built the ${scene.name} picture! Well done, Lily!`); }
      return true;
    }

    wrap.append(board, tray);
    run.root.append(wrap);
    const fit = () => {
      const W = Math.min(screenEl.clientWidth, 900) - 8;
      const H = screenEl.clientHeight - bub.offsetHeight - 90;
      let cell = 170;
      for (; cell > 48; cell -= 4) {
        const perRow = Math.max(1, Math.floor((W + 10) / (cell + 16)));
        if (cols * cell > W) continue;
        if (rows * cell + Math.ceil(n / perRow) * (cell + 10) <= H) break;
      }
      wrap.style.setProperty('--cell', `${cell}px`);
    };
    fit();
    addEventListener('resize', fit);
    run.cleanups.push(() => removeEventListener('resize', fit));
  }

  // ---------- 5. Vampire Shadows: match a picture to its shadow ----------
  const SHADOW_ITEMS = ['🦇', '🐶', '🦄', '👑', '🍭', '⭐', '🏰', '🦋', '🐙', '🌙', '🍎', '🚒', '🧁', '👻', '🦜', '🐳', '🎈', '🍦', '🐢', '🦀', '⚓', '🦕', '🐘', '🐸'];
  function shadowRound(run) {
    const n = [3, 3, 4][run.level];
    const target = pickNot(SHADOW_ITEMS, run.last); run.last = target;
    const opts = shuffle([target, ...shuffle(SHADOW_ITEMS.filter((e) => e !== target)).slice(0, n - 1)]);
    const name = NAMES[target];
    bubble('🧛', `Which shadow is the ${name}?`, `Which shadow belongs to the ${name}?`);
    const hero = h('div', { class: 'hero emoji' }, h('span', {}, target));
    hero.addEventListener('click', () => say(name));
    const row = h('div', { class: 'shadows' });
    opts.forEach((e) => {
      const b = h('button', { class: 'shadow-btn emoji', type: 'button', 'aria-label': 'shadow' }, h('span', {}, e));
      b.addEventListener('click', () => {
        if (run.busy) return;
        if (e === target) { b.classList.add('reveal'); win(b, `Yes! That's the ${name}! ${pick(PRAISE)}`); }
        else miss(b, `Hmm, that's the shadow of a ${NAMES[e]}. Try again!`);
      });
      row.append(b);
    });
    run.root.append(hero, row);
  }

  // ---------- 6. Dress-up Patterns: what comes next? ----------
  const DRESS = ['👗', '👠', '👑', '🎀', '💄', '👛', '💍', '💖', '🌸', '🦋', '⭐', '🦄'];
  function patternRound(run) {
    const unit = [pick([['A', 'B']]), pick([['A', 'A', 'B'], ['A', 'B', 'B']]), pick([['A', 'B', 'C'], ['A', 'B', 'C'], ['A', 'A', 'B']])][run.level];
    const letters = [...new Set(unit)];
    const picks = shuffle(DRESS).slice(0, letters.length + 1);
    const map = Object.fromEntries(letters.map((l, i) => [l, picks[i]]));
    const extra = picks[letters.length];
    const len = unit.length === 2 ? 5 + rand(2) : 5 + rand(3);
    const seq = Array.from({ length: len }, (_, i) => map[unit[i % unit.length]]);
    const answer = map[unit[len % unit.length]];
    bubble('👸', 'What comes next?', 'Look at the pattern. What comes next?');
    const row = h('div', { class: 'pattern' });
    seq.forEach((e) => {
      const s = h('button', { class: 'slot emoji', type: 'button', 'aria-label': NAMES[e] }, e);
      s.addEventListener('click', () => { sfx('pop'); say(NAMES[e]); });
      row.append(s);
    });
    const ask = h('div', { class: 'slot ask' }, '?');
    row.append(ask);
    const opts = shuffle([...new Set([answer, ...Object.values(map), extra])]).slice(0, 3);
    if (!opts.includes(answer)) opts[0] = answer;
    const cols = shuffle(['#FFD1EC', '#D6ECFF', '#D4F7EA']);
    const choices = h('div', { class: 'choices' });
    shuffle(opts).forEach((e, i) => {
      const b = h('button', { class: 'choice emoji', type: 'button', style: `--c:${cols[i]}`, 'aria-label': NAMES[e] }, e);
      b.addEventListener('click', () => {
        if (run.busy) return;
        if (e === answer) {
          ask.textContent = e; ask.classList.remove('ask'); ask.classList.add('filled', 'emoji');
          win(ask, `Yes! The ${NAMES[e]}! ${pick(PRAISE)}`);
        } else miss(b, `The ${NAMES[e]}? Hmm, look again!`);
      });
      choices.append(b);
    });
    run.root.append(row, choices);
  }

  // ---------- home ----------
  const GAMES = [
    { id: 'colours', name: 'Unicorn Colours', icon: '🦄', c: '#FF6EC7', d: '#D34A9F', theme: 't-colours', goal: 5, round: colourRound, stickers: ['🦄', '🌈', '🎈', '💖', '🍭'] },
    { id: 'count', name: 'Puppy Counting', icon: '🐶', c: '#38B6FF', d: '#1D8BD0', theme: 't-count', goal: 5, round: countRound, stickers: ['🐶', '🦴', '🚒', '🐾', '🚓'] },
    { id: 'pirate', name: 'Pirate Treasure', icon: '🏴‍☠️', c: '#2ED3A7', d: '#1C9E7C', theme: 't-pirate', goal: 1, round: sortRound, stickers: ['🦜', '💰', '⚓', '🐙', '🏝️'] },
    { id: 'jigsaw', name: 'Magic Jigsaws', icon: '🧩', c: '#FFC93C', d: '#D9A11A', theme: 't-jigsaw', goal: 1, round: jigsawRound, stickers: ['🧩', '🏰', '🧜‍♀️', '⭐', '🌈'] },
    { id: 'shadows', name: 'Vampire Shadows', icon: '🧛', c: '#8B5CF6', d: '#6A3DD6', theme: 't-shadows', goal: 5, round: shadowRound, stickers: ['🧛', '🦇', '🌙', '👻', '🎃'] },
    { id: 'patterns', name: 'Dress-up Patterns', icon: '👑', c: '#FF7A59', d: '#DC5536', theme: 't-patterns', goal: 5, round: patternRound, stickers: ['👑', '👗', '👠', '🎀', '💍'] },
  ];
  const TITLE_COLS = ['#FF4FA3', '#FF9F1C', '#2ED3A7', '#38B6FF', '#8B5CF6', '#FF7A59'];

  function showHome() {
    endRun(); hush();
    cheer.hidden = true;
    document.body.className = 't-home';
    homeBtn.style.visibility = 'hidden';
    const stack = h('div', { class: 'stack' });
    const name = h('span', { class: 'name' });
    [...'Lily\'s'].forEach((ch, i) => name.append(h('span', { style: `color:${TITLE_COLS[i % TITLE_COLS.length]};animation-delay:${i * 0.15}s` }, ch)));
    const title = h('h1', { class: 'title' }, name, h('span', { class: 'sub' }, 'Magic Games'));
    title.addEventListener('click', () => { sfx('yay'); say('Hello Lily! Tap a game to play!'); burstAt(title, 30); });
    const tiles = h('div', { class: 'tiles' });
    GAMES.forEach((g) => {
      const t = h('button', { class: 'tile', type: 'button', style: `--c:${g.c};--d:${g.d}` },
        h('span', { class: 'icon emoji' }, g.icon), h('span', { class: 'label' }, g.name));
      t.addEventListener('click', () => { sfx('pop'); startGame(g); });
      tiles.append(t);
    });
    const book = h('div', { class: 'book' }, h('span', { class: 'book-label' }, 'Lily\'s stickers'));
    const got = store.get('stickers', []);
    if (got.length) got.forEach((s) => book.append(h('span', { class: 'sticker emoji' }, s)));
    else book.append(h('span', { class: 'empty' }, 'Finish a game to win a sticker!'));
    stack.append(title, tiles, book);
    screenEl.replaceChildren(stack);
    screenEl.scrollTop = 0;
  }

  document.addEventListener('contextmenu', (e) => e.preventDefault());
  showHome();
})();
</script>
</body>
